  <text x="116" y="700" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5B46E0">↑ Fix verifiziert</text>

  <line x1="290" y1="562" x2="290" y2="610" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <rect x="195" y="612" width="190" height="56" rx="11" fill="#B45309" fill-opacity=".13" stroke="#B45309" stroke-width="1.8"/>
  <text x="290" y="634" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Verifizieren</text>
  <text x="290" y="649" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">verification-</text>
  <text x="290" y="660" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">before-completion</text>
  <line x1="290" y1="668" x2="290" y2="698" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <text x="302" y="688" font-size="10.5" font-weight="600" fill="#4A4757">Nachweis</text>

  <rect x="195" y="700" width="190" height="56" rx="11" fill="#B45309" fill-opacity=".13" stroke="#B45309" stroke-width="1.8"/>
  <text x="290" y="722" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Code Review</text>
  <text x="290" y="737" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">requesting-/receiving-</text>
  <text x="290" y="748" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">code-review</text>
  <path d="M385,728 C 478,728 478,534 387,534" fill="none" stroke="#5B46E0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aV)"/>
  <text transform="translate(494 632) rotate(-90)" text-anchor="middle" font-size="11" font-weight="700" fill="#5B46E0">Changes requested</text>

  <!-- Abschluss -->
  <line x1="290" y1="756" x2="290" y2="832" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <text x="302" y="800" font-size="10.5" font-weight="600" fill="#4A4757">approved</text>
  <rect x="195" y="834" width="190" height="56" rx="11" fill="#BE185D" fill-opacity=".13" stroke="#BE185D" stroke-width="1.8"/>
  <text x="290" y="856" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Branch abschließen</text>
  <text x="290" y="871" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">finishing-a-</text>
  <text x="290" y="882" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">development-branch</text>

  <!-- Artefakte rechts -->
  <line x1="385" y1="108" x2="526" y2="108" stroke="#8B7360" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aT)"/>
  <path d="M530,80 L676,80 L690,94 L690,136 L530,136 Z" fill="#8B7360" fill-opacity=".15" stroke="#8B7360" stroke-width="1.8"/>
  <path d="M676,80 L676,94 L690,94" fill="none" stroke="#8B7360" stroke-width="1.4"/>
  <text x="610" y="106" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="13" font-weight="700" fill="#6a5440">…-design.md</text>
  <text x="610" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="#4A4757">docs/superpowers/specs/</text>

  <line x1="385" y1="192" x2="526" y2="192" stroke="#8B7360" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aT)"/>
  <path d="M530,164 L676,164 L690,178 L690,220 L530,220 Z" fill="#8B7360" fill-opacity=".15" stroke="#8B7360" stroke-width="1.8"/>
  <path d="M676,164 L676,178 L690,178" fill="none" stroke="#8B7360" stroke-width="1.4"/>
  <text x="610" y="190" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="13" font-weight="700" fill="#6a5440">…-&lt;feature&gt;.md</text>
  <text x="610" y="208" text-anchor="middle" font-size="10" font-weight="600" fill="#4A4757">docs/superpowers/plans/</text>

  <line x1="385" y1="280" x2="526" y2="280" stroke="#6B6878" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="530" y="260" width="160" height="40" rx="10" fill="none" stroke="#6B6878" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="610" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#4A4757">eigenes Verzeichnis</text>

  <line x1="460" y1="439" x2="526" y2="439" stroke="#8B7360" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aT)"/>
  <path d="M530,406 L676,406 L690,420 L690,472 L530,472 Z" fill="#8B7360" fill-opacity=".15" stroke="#8B7360" stroke-width="1.8"/>
  <path d="M676,406 L676,420 L690,420" fill="none" stroke="#8B7360" stroke-width="1.4"/>
  <text x="610" y="435" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="13" font-weight="700" fill="#6a5440">progress.md</text>
  <text x="610" y="452" text-anchor="middle" font-size="10" font-weight="600" fill="#4A4757">geteiltes Ledger</text>
  <text x="610" y="464" text-anchor="middle" font-size="10" font-weight="600" fill="#4A4757">.superpowers/sdd/…</text>

  <path d="M520,612 H526 V756 H520" fill="none" stroke="#6B6878" stroke-width="1.4"/>
  <text x="610" y="690" text-anchor="middle" font-size="11.5" font-style="italic" font-weight="600" fill="#4A4757">– kein Artefakt –</text>
  <text x="610" y="706" text-anchor="middle" font-size="10" fill="#6B6878">Arbeit im Agent-Kontext</text>

  <line x1="385" y1="862" x2="526" y2="862" stroke="#BE185D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aR)"/>
  <rect x="530" y="834" width="160" height="56" rx="11" fill="#fff" stroke="#BE185D" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="610" y="860" text-anchor="middle" font-size="13" font-weight="700" fill="#BE185D">Git Remote / PR</text>
  <text x="610" y="877" text-anchor="middle" font-size="10" font-weight="600" fill="#4A4757">kein Repo-File</text>
</svg>
