  <rect x="195" y="252" width="190" height="56" rx="11" fill="#0D9488" fill-opacity=".13" stroke="#0D9488" stroke-width="1.8"/>
  <text x="290" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Workspace isolieren</text>
  <text x="290" y="296" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#4A4757">using-git-worktrees</text>
  <line x1="290" y1="308" x2="290" y2="322" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>

  <polygon points="290,324 362,352 290,380 218,352" fill="#fff" stroke="#0D9488" stroke-width="1.8"/>
  <text x="290" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#1B1A23">Ausführungs-</text>
  <text x="290" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#1B1A23">methode?</text>
  <text x="372" y="338" font-size="10" font-style="italic" font-weight="600" fill="#4A4757">Mensch wählt</text>

  <rect x="120" y="392" width="340" height="94" rx="12" fill="none" stroke="#8B7360" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="290" y="479" text-anchor="middle" font-size="10" font-weight="600" fill="#6a5a4c">beide teilen sich dasselbe Ledger</text>

  <line x1="218" y1="352" x2="207" y2="402" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <line x1="362" y1="352" x2="373" y2="402" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <text x="196" y="380" text-anchor="end" font-size="10" font-weight="600" fill="#4A4757">inline</text>
  <text x="384" y="380" font-size="10" font-weight="600" fill="#4A4757">Subagenten</text>

  <rect x="130" y="404" width="155" height="56" rx="11" fill="#0D9488" fill-opacity=".13" stroke="#0D9488" stroke-width="1.8"/>
  <text x="207" y="428" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B1A23">1 Agent, 1 Kontext</text>
  <text x="207" y="446" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10.5" font-weight="600" fill="#4A4757">executing-plans</text>
  <rect x="295" y="404" width="155" height="56" rx="11" fill="#0D9488" fill-opacity=".13" stroke="#0D9488" stroke-width="1.8"/>
  <text x="372" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1B1A23">Subagent pro Task</text>
  <text x="372" y="440" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">subagent-driven-</text>
  <text x="372" y="452" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">development</text>

  <line x1="290" y1="486" x2="290" y2="504" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <rect x="195" y="506" width="190" height="56" rx="11" fill="#0D9488" fill-opacity=".13" stroke="#0D9488" stroke-width="1.8"/>
  <text x="290" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B1A23">Test-Driven Development</text>
  <text x="290" y="548" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10.5" font-weight="600" fill="#4A4757">RED → GREEN → REFACTOR</text>

