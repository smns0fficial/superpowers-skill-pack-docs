  <rect x="56" y="612" width="120" height="56" rx="11" fill="#B45309" fill-opacity=".13" stroke="#B45309" stroke-width="1.8"/>
  <text x="116" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A23">Fehleranalyse</text>
  <text x="116" y="649" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">systematic-</text>
  <text x="116" y="660" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="10" font-weight="600" fill="#4A4757">debugging</text>
  <path d="M195,522 H100 V610" fill="none" stroke="#5B46E0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aV)"/>
  <path d="M136,610 V548 H193" fill="none" stroke="#5B46E0" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aV)"/>
