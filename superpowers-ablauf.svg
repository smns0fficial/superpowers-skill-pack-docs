<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 940" role="img" aria-label="Superpowers-Ablauf in vier Phasen mit den erzeugten Artefakten" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="aF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#1B1A23"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#5B46E0"/></marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#8B7360"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#BE185D"/></marker>
  </defs>

  <!-- Phasen-Bänder + Streifen -->
  <rect x="0" y="54" width="700" height="178" fill="#2563EB" fill-opacity=".08"/>
  <rect x="0" y="232" width="700" height="340" fill="#0D9488" fill-opacity=".08"/>
  <rect x="0" y="572" width="700" height="234" fill="#B45309" fill-opacity=".08"/>
  <rect x="0" y="806" width="700" height="130" fill="#BE185D" fill-opacity=".08"/>
  <rect x="0" y="54" width="28" height="178" fill="#2563EB" fill-opacity=".08"/>
  <rect x="0" y="232" width="28" height="340" fill="#0D9488" fill-opacity=".08"/>
  <rect x="0" y="572" width="28" height="234" fill="#B45309" fill-opacity=".08"/>
  <rect x="0" y="806" width="28" height="130" fill="#BE185D" fill-opacity=".08"/>
  <g font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <text transform="translate(18 143) rotate(-90)" fill="#2563EB">PLANEN</text>
    <text transform="translate(18 402) rotate(-90)" fill="#0D9488">UMSETZEN</text>
    <text transform="translate(18 689) rotate(-90)" fill="#B45309">QUALITÄT</text>
    <text transform="translate(18 871) rotate(-90)" fill="#BE185D">ABSCHLUSS</text>
  </g>

  <!-- Kopf -->
  <rect x="40" y="8" width="460" height="38" rx="9" fill="#fff" stroke="#9a96ac" stroke-dasharray="4 3"/>
  <text x="270" y="32" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="12" font-weight="600" fill="#4A4757">using-superpowers · wählt automatisch den passenden Skill</text>
  <text x="610" y="32" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#4A4757">ARTEFAKTE</text>
  <line x1="290" y1="46" x2="290" y2="78" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>

  <!-- Planen -->
  <rect x="195" y="80" width="190" height="56" rx="11" fill="#2563EB" fill-opacity=".13" stroke="#2563EB" stroke-width="1.8"/>
  <text x="290" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Anforderungen klären</text>
  <text x="290" y="124" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#4A4757">brainstorming</text>
  <line x1="290" y1="136" x2="290" y2="162" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <rect x="195" y="164" width="190" height="56" rx="11" fill="#2563EB" fill-opacity=".13" stroke="#2563EB" stroke-width="1.8"/>
  <text x="290" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1A23">Plan erstellen</text>
  <text x="290" y="208" text-anchor="middle" font-family="Menlo, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#4A4757">writing-plans</text>
  <line x1="290" y1="220" x2="290" y2="250" stroke="#1B1A23" stroke-width="1.6" marker-end="url(#aF)"/>
  <text x="302" y="240" font-size="10.5" font-weight="600" fill="#4A4757">Tasks à 2–5 Min</text>

